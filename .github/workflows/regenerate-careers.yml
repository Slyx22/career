name: Regenerate careers from O*NET

# Downloads the free O*NET Database (text version) and rebuilds the career
# files in python-engine/app/data/career_models using the exact skill
# mapping. Run it from GitHub: Actions -> "Regenerate careers from O*NET"
# -> Run workflow (for example when O*NET publishes a new release).

on:
  workflow_dispatch:
  push:
    branches: [fix/breakdown-and-steps]
    paths: ["python-engine/scripts/onet_bulk_import.py"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and download the latest O*NET text database
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (career-readiness-analyzer data refresh; github actions)"
          base="https://www.onetcenter.org/dl_files/database"
          candidates=""
          page=$(curl -fsSL -A "$UA" https://www.onetcenter.org/database.html || true)
          if [ -n "$page" ]; then
            candidates=$(printf '%s' "$page" | grep -oE 'db_[0-9]+_[0-9]+_text\.zip' | sort -uV -r || true)
          else
            echo "::warning::Could not read the O*NET database page; trying known file names"
          fi
          # Fallback: probe recent release names, newest first.
          for major in 32 31 30 29; do for minor in 3 2 1 0; do
            candidates="$candidates db_${major}_${minor}_text.zip"
          done; done
          file=""
          for f in $candidates; do
            if curl -fsSL -A "$UA" -o onet.zip "$base/$f"; then file="$f"; break; fi
          done
          if [ -z "$file" ]; then echo "::error::Could not download any O*NET text database from $base"; exit 1; fi
          echo "::notice::Downloaded O*NET $file ($(du -h onet.zip | cut -f1))"
          unzip -q onet.zip -d onet || { echo "::error::Downloaded $file but could not unzip it"; exit 1; }
          occ=$(find onet -name 'Occupation Data.txt' | head -1)
          if [ -z "$occ" ]; then echo "::error::No 'Occupation Data.txt' in $file. Files: $(find onet -name '*.txt' | head -20 | tr '\n' ' ')"; exit 1; fi
          dir=$(dirname "$occ")
          echo "::notice::Files in $file: $(ls "$dir" | tr '\n' ',' | head -c 900)"
          for f in "Software Skills.txt" "Technology Skills.txt" "Essential Skills.txt" "Skills.txt"; do
            [ -f "$dir/$f" ] && echo "::notice::$f header: $(head -1 "$dir/$f" | tr '\t' '|') // first row: $(sed -n 2p "$dir/$f" | tr '\t' '|' | head -c 300)"
          done
          echo "ONET_DIR=$dir" >> "$GITHUB_ENV"
          echo "ONET_VERSION=${file%_text.zip}" >> "$GITHUB_ENV"

      - name: Rebuild career files
        working-directory: python-engine
        run: |
          set -o pipefail
          python scripts/onet_bulk_import.py --db-dir "$GITHUB_WORKSPACE/$ONET_DIR" --import-all 2>&1 | tee import.log || {
            echo "::error::Import failed: $(tail -5 import.log | tr '\n' ' ')"; exit 1; }
          python -c "import json;r=json.load(open('scripts/last_import_report.json'));print('::notice::Written', r['careers_written'], 'skipped', r['careers_skipped_too_few_rated_skills'], 'unmapped', list(r['unmapped_onet_elements'])[:15])"
          rm -f import.log

      - name: Relink South African job titles and refresh the website's fallback list
        working-directory: python-engine
        run: |
          pip install -q -r requirements.txt openpyxl xlrd
          python scripts/build_sa_occupations.py
          python scripts/export_careers_json.py

      - name: Commit the regenerated files
        run: |
          rm -rf onet onet.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A python-engine/app/data/career_models python-engine/scripts/last_import_report.json \
            python-engine/app/data/sa_occupations.json frontend/public/data/careers.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Regenerate career models from O*NET ${ONET_VERSION} with exact skill mapping"
          git push
