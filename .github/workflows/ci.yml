name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-engine-tests:
    name: Python engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  frontend-build:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        # No Clerk/Supabase/AI keys are configured in CI, and none are
        # required: the app is built to run and build cleanly without
        # them (see lib/clerk.ts / components/AuthProvider.tsx).
        run: npm run build
        env:
          PYTHON_API_URL: http://localhost:8000
